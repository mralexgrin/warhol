<!doctype html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <a class="skip" href="#main">Skip to the direction on screen</a>

  <!-- The board's own chrome. Outside the slab on purpose: nothing here is a
       Scout control, and it should never be mistaken for one. -->
  <div class="board">
    <div class="board-t">Trends<span>The recommended tab, and the four it came from</span></div>
    <div class="dirs" role="group" aria-label="View"></div>
    <div class="board-r">
      <span class="board-src"></span>
      <button class="themebtn" data-theme-toggle type="button">Dark</button>
    </div>
  </div>

  <div class="slab slab--app">
    <nav class="railcol railcol--wide" aria-label="Sections">
      <div class="brandrow"><span class="me">S</span>
        <span><span class="wm">Scout</span><span class="sub-t">Origination desk</span></span></div>
      <button class="btn btn--ghost newbrief" type="button" disabled>+ New brief</button>
      <div class="nav" id="rail"></div>
      <div class="acct acct--rail">
        <button class="whoami" type="button" disabled>
          <span class="ini ini--lilac ini--xs">AG</span>
          <span class="who"><b>Alex Grinshpoon</b><span>alex.grinshpoon@thearenagroup.net</span></span>
        </button>
      </div>
      <p class="engineft">Warhol engine · Paradium</p>
    </nav>
    <main class="wrap tr-wrap" id="main" tabindex="-1"></main>
  </div>

  <div id="status" class="sr-only" aria-live="polite"></div>
  <div class="tip" id="tip" role="tooltip" aria-hidden="true"></div>

  <script src="trends-data.js"></script>
  <script src="trends.js"></script>
