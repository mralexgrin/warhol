<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout</title>
<meta name="description" content="Scout. The origination desk: evidence-backed shortlists, every morning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,300..800;1,300..800&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="alloy.css">
<link rel="stylesheet" href="scout-v52.css">
<!-- Errors from the first instant of the page, before anything else could be listening.
     Read by the smoke tests (test/smoke.html); costs nothing otherwise. -->
<script>
  window.__scoutErrors = [];
  addEventListener('error', function (e) { __scoutErrors.push(e.message); });
  addEventListener('unhandledrejection', function (e) { __scoutErrors.push('rejection: ' + (e.reason && e.reason.message || e.reason)); });
</script>
</head>
<body>
  <a class="skip" href="#main">Skip to the drop</a>
  <div id="app"></div>
  <!-- One small region for genuine status messages. v5 put aria-live on #app,
       which is the whole application and is replaced on every render. -->
  <div id="status" class="sr-only" aria-live="polite"></div>

  <script src="warhol-seed.js"></script>
  <script src="v52-seed.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
