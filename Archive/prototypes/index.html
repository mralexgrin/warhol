<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout — prototypes</title>
<style>
  :root{
    --bg:#0e0e10; --panel:#17171a; --line:#2a2a30;
    --ink:#f2f2f0; --dim:#9a9aa2; --faint:#65656e; --accent:#e8523f;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       display:flex;flex-direction:column;overflow:hidden}

  header{flex:0 0 auto;border-bottom:1px solid var(--line);padding:12px 20px;
         display:flex;align-items:center;gap:24px;flex-wrap:wrap;background:var(--panel)}
  .brand{font-weight:700;letter-spacing:-.01em;font-size:15px;white-space:nowrap}
  .brand span{color:var(--faint);font-weight:400;margin-left:10px;font-size:13px}

  .toggle{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .toggle button{appearance:none;background:transparent;border:0;color:var(--dim);
    font:inherit;font-size:13px;padding:8px 16px;cursor:pointer;white-space:nowrap;
    border-right:1px solid var(--line)}
  .toggle button:last-child{border-right:0}
  .toggle button:hover{color:var(--ink);background:#202027}
  .toggle button[aria-pressed="true"]{background:var(--ink);color:#111}
  .toggle button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

  .meta{color:var(--faint);font-family:var(--mono);font-size:11.5px;
        margin-left:auto;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .meta a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}
  .meta a:hover{color:var(--ink);border-color:var(--dim)}

  main{flex:1 1 auto;min-height:0;position:relative}
  iframe{width:100%;height:100%;border:0;display:block;background:#fff}

  /* file:// fallback launcher */
  .launcher{height:100%;overflow:auto;padding:56px 32px;display:flex;
            align-items:flex-start;justify-content:center}
  .inner{max-width:880px;width:100%}
  .inner h1{font-size:26px;margin:0 0 10px;letter-spacing:-.02em}
  .inner p.lede{color:var(--dim);margin:0 0 32px;line-height:1.6;font-size:15px;max-width:62ch}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  @media (max-width:760px){.cards{grid-template-columns:1fr}}
  .card{border:1px solid var(--line);border-radius:10px;padding:22px;background:var(--panel);
        text-decoration:none;color:inherit;display:block;transition:border-color .15s}
  .card:hover{border-color:var(--dim)}
  .card .tag{font-family:var(--mono);font-size:11px;color:var(--accent);
             text-transform:uppercase;letter-spacing:.09em}
  .card h2{font-size:18px;margin:10px 0 8px;letter-spacing:-.01em}
  .card p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.6}
  .card .go{margin-top:16px;font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .note{margin-top:34px;border-left:2px solid var(--line);padding:2px 0 2px 16px;
        color:var(--faint);font-size:13px;line-height:1.65}
  code{font-family:var(--mono);font-size:12.5px;color:var(--dim);
       background:#000;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>

<header>
  <div class="brand">Scout <span>the current build, and what it came from</span></div>
  <div class="toggle" id="toggle" role="group" aria-label="Choose prototype"></div>
  <div class="meta" id="meta"></div>
</header>

<main id="main"></main>

<script>
(function () {
  'use strict';

  var VERSIONS = [
    {
      key: 'v54',
      label: 'Current build',
      skill: 'Current build · pre-demo fixes',
      path: '/App/scout/index.html',
      notes: '/App/scout/DESIGN-NOTES.md',
      blurb: 'v5.3 with the four defects that would have broken the demo taken out. Run a name matched the handle you typed against nothing — it returned the same person for every input, including a URL on a platform Scout cannot read. The house brief printed other briefs’ Fit reasoning under its own name, so twenty-nine rejected rows argued about college football on a brief that has never mentioned it. The admin panel offered a bar of 70/74/78/82 against a live bar of 25, where one click empties the drop — and an empty drop is designed to look considered, so it fails silently. And three PRD section numbers were rendering on a hundred and seventeen reports. Also here: the budget ceiling reads the measured bill instead of an invented one, the ring draws the score rather than confidence, and Sources is the only place that says where Scout looks. Start here.'
    },
    {
      key: 'v53',
      label: 'v5.3 · Real people',
      skill: 'Superseded · PRD v1.5',
      path: '/Archive/prototypes/v5.3/index.html',
      notes: '/Archive/prototypes/v5.3/DESIGN-NOTES.md',
      blurb: 'The first build with nobody invented in it. Twenty real creators, read by the engine — real handles, real follower counts, real avatars linked from the platforms’ own CDNs, real inventory checks. Four clear the bar. Building it found the bug that mattered most: the engine re-read its threshold against real people and moved it from 78 to 25, the prototype kept its own copy of 78, and the drop rendered perfectly while showing nobody — a correct empty state is the one defect you cannot see, because §6.1 designs an empty drop to look considered. It also found the Fit gate quietly re-scoring what the score had already counted, failing the two best creators on the board. Also: faces and clickable accounts everywhere, “first look — no trend yet” stated rather than assumed, Run a name taking a URL and keeping what you searched on screen, a preliminary headline built only from countable facts, real member accounts instead of a mocked Google button, and Sources — every place Scout is allowed to look and what switching each one off costs you in proof. Start here.'
    },
    {
      key: 'v52',
      label: 'v5.2 · Receipts',
      skill: 'PRD v1.3',
      path: '/Archive/prototypes/v5.2/index.html',
      notes: '/Archive/prototypes/v5.2/DESIGN-NOTES.md',
      blurb: 'The claim opens where it is made. “No newsletter. We looked in 6 places” is now clickable in place, and the six doors are underneath it with the status code and the address — which is what makes the line a fact rather than an assertion. Building it exposed why it had never been built: the count was authored on the line and the rows were authored in a table, and the two had drifted, so a line claiming six places had three rows behind it. The count is now derived from the rows, from a probe catalogue shaped like the engine’s own. Also: the gates stated in sentences, but only on a creator who did not get in; the arithmetic strip cut from the sticky bar; and the wall — no language model may say whether something exists — finally said on screen. Start here.'
    },
    {
      key: 'v51',
      label: 'v5.1 · Reviewed',
      skill: 'Superseded · PRD v1.3',
      path: '/Archive/prototypes/v5.1/index.html',
      notes: '/Archive/prototypes/v5.1/DESIGN-NOTES.md',
      blurb: 'v5 after a three-reviewer design pass \u2014 craft, accessibility, and heuristics with a cold cognitive walkthrough. No new screens and no design changes: the card, the report and the ? survived review intact. What changed is underneath. Four criticals, including a media-query conflict that made 85% of every screen unreachable on a phone, and a rename gap that let the one word the PRD bans by name reach the outreach email. Plus the things that contradicted themselves \u2014 two totals in one disclosure, a brief that promised nobody and delivered seven. Start here.'
    },
    {
      key: 'v5',
      label: 'v5 · Scout',
      skill: 'Superseded \u00b7 PRD v1.3',
      path: '/Archive/prototypes/v5/index.html',
      notes: '/Archive/prototypes/v5/DESIGN-NOTES.md',
      blurb: 'The current build, and the first one called Scout \u2014 Warhol is the engine and it says so only in the footer. The card is three claims with Pressure on two lines, every value a change rather than a level, and the creator\u2019s own words on the card. The report is that card expanded, with the arithmetic attached to each claim instead of hidden in a drawer. New: briefs as tabs behind a house brief, a brief written as a description and read back as chips, the passed list, an admin panel, and an outcome on a promoted creator. Sign in and you land in January 2024. Start here.'
    },
    {
      key: 'v4',
      label: 'v4 · Signals',
      skill: 'Superseded · PRD v1.2',
      path: '/Archive/prototypes/v4/index.html',
      notes: '/Archive/prototypes/v4/DESIGN-NOTES.md',
      blurb: 'One score mark everywhere \u2014 a ring whose sweep is confidence, banded on the 75% floor \u2014 and the card carrying three named signals taken straight from the record: Demand, Missing, Timing. Green Promote, amber Watch, outlined Pass. The report gets a way out and a compact header that takes over on scroll. Superseded by v5.'
    },
    {
      key: 'v3',
      label: 'v3 · Inverted',
      skill: 'Superseded',
      path: '/Archive/prototypes/v3/index.html',
      notes: '/Archive/prototypes/v3/DESIGN-NOTES.md',
      blurb: 'The grooming session\u2019s first build. The drop became the primary object — you sign in and you are looking at today’s creators. A brief became a free saved filter rather than a wizard you pass through. Cards collapse to a third of their height, guidance moved beside the terms it explains, and Alloy’s colour came back with a job attached. Superseded by v4.'
    },
    {
      key: 'v2',
      label: 'v2 · Alloy',
      skill: 'PRD v1.2 · Alloy toolkit',
      path: '/Archive/prototypes/v2/index.html',
      notes: '/Archive/prototypes/v2/DESIGN-NOTES.md',
      blurb: 'The PRD implemented literally: a sign-in gate, the three-prompt mandate wizard, the overlap prompt, first-run drops for both roles, five just-in-time hints and the per-creator Ledger — all in the Alloy toolkit. Superseded by v3, and useful for seeing what the grooming session removed.'
    },
    {
      key: 'design-taste',
      label: 'v1-B · Case file',
      skill: '/design-taste-frontend',
      path: '/Archive/prototypes/v1-b-case-file/index.html',
      notes: '/Archive/prototypes/v1-b-case-file/DESIGN-NOTES.md',
      blurb: 'A dark case file where the typeface is the engine declaration — reading serif for quoted human speech, mono for every number and provenance line. Each card is literally the quote set beside the empty inventory. The direction v2 was built from.'
    },
    {
      key: 'impeccable',
      label: 'v1-A · Trade tip sheet',
      skill: '/impeccable',
      path: '/Archive/prototypes/v1-a-trade-tip-sheet/index.html',
      notes: '/Archive/prototypes/v1-a-trade-tip-sheet/DESIGN-NOTES.md',
      blurb: 'An origination desk publishes a trade paper. The drop is a ranked chart, the Scout Report is a one-sheet, the rewind is a back issue with its own volume number on aged stock. Two-ink newsprint; verification state is drawn notation, not colour. Not carried forward.'
    }
  ];

  var isFile = location.protocol === 'file:';
  var main = document.getElementById('main');
  var toggle = document.getElementById('toggle');
  var meta = document.getElementById('meta');
  var current = 0;

  function show(i) {
    current = i;
    [].forEach.call(toggle.children, function (b, n) {
      b.setAttribute('aria-pressed', String(n === i));
    });
    var v = VERSIONS[i];
    main.innerHTML = '';
    var f = document.createElement('iframe');
    f.src = v.path;
    f.title = v.label;
    main.appendChild(f);
    meta.innerHTML = '<span>' + v.skill + '</span>' +
      '<a href="' + v.path + '" target="_blank" rel="noopener">open standalone ↗</a>' +
      '<a href="' + v.notes + '" target="_blank" rel="noopener">design notes ↗</a>';
  }

  if (isFile) {
    // Chrome gives every file:// document an opaque origin, so a sibling file
    // cannot be framed. Launch each one in its own tab instead of showing a
    // silently blank iframe.
    toggle.remove();
    meta.innerHTML = '<span>opened over file:// — launching in tabs</span>';
    var cards = VERSIONS.map(function (v) {
      return '<a class="card" href="' + v.path + '">' +
             '<div class="tag">' + v.skill + '</div>' +
             '<h2>' + v.label + '</h2>' +
             '<p>' + v.blurb + '</p>' +
             '<div class="go">open → &nbsp;·&nbsp; <span>' + v.notes + '</span></div>' +
             '</a>';
    }).join('');
    main.innerHTML =
      '<div class="launcher"><div class="inner">' +
      '<h1>Scout prototypes</h1>' +
      '<p class="lede"><b>App/scout</b> is the current build. It is <b>v5.3</b>, the ' +
      'first one with nobody invented in it, with four defects taken out that would each have ' +
      'broken the demo on their own: a name search that ignored what you typed, a brief that ' +
      'printed another brief’s reasoning under its own name, a threshold control set to numbers ' +
      'that empty the screen, and PRD section numbers rendering on the reports. Everything before ' +
      'it is kept as the record of what each pass removed. The two <b>v1</b> ' +
      'directions are preserved exactly as they shipped — built in parallel from the same PRD and ' +
      'the same 24-creator cohort by agents that could not see each other’s work.</p>' +
      '<div class="cards">' + cards + '</div>' +
      '<div class="note">Side-by-side toggling needs them served from one origin, which <code>file://</code> ' +
      'will not allow. Run <code>node serve.js</code> in this folder and open ' +
      '<code>http://localhost:4321</code> to flip between them in place.</div>' +
      '</div></div>';
    return;
  }

  VERSIONS.forEach(function (v, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = v.label;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () { show(i); });
    toggle.appendChild(b);
  });

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === '1') show(0);
    if (e.key === '2') show(1);
    if (e.key === '3') show(2);
    if (e.key === '4') show(3);
    if (e.key === '5') show(4);
    if (e.key === '6') show(5);
    if (e.key === '7') show(6);
    if (e.key === 'ArrowLeft' && current > 0) show(current - 1);
    if (e.key === 'ArrowRight' && current < VERSIONS.length - 1) show(current + 1);
  });

  show(0);
})();
</script>
</body>
</html>
